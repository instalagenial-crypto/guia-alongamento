<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><style>
.b{stroke:#1d2430;stroke-linecap:round;stroke-linejoin:round;fill:none}
.r{stroke:#e0662b;stroke-linecap:round;stroke-linejoin:round;fill:none}
