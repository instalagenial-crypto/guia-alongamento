<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><style>
.b{stroke:#1d2430;stroke-linecap:round;stroke-linejoin:round;fill:none}
.r{stroke:#e0662b;stroke-linecap:round;stroke-linejoin:round;fill:none}
.l{stroke:#3a6ea5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.f{stroke:#9aa7b5;stroke-width:3}.c{stroke:#6d5a44;stroke-width:6;stroke-linecap:round}
.g{stroke:#2e7d4f;stroke-width:3;fill:none;stroke-linecap:round}.hd{fill:#1d2430}.pz{fill:#e53935}
.a{animation-duration:6s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes pu{0%,100%{opacity:.08}35%,70%{opacity:.42}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-3s!important}}
.lg{transform-origin:160px 136px;animation-name:pl}@keyframes pl{0%,100%{transform:rotate(15deg)}35%,70%{transform:rotate(0)}}.ua{transform-origin:80px 128px;animation-name:ua}@keyframes ua{0%,100%{transform:rotate(-8.8deg)}35%,70%{transform:rotate(0)}}.pz{animation-name:pu}</style><line class="f" x1="0" y1="150" x2="320" y2="150"/>
<circle class="pz a" cx="166" cy="140" r="18"/>
<line class="l" stroke-width="14" x1="158" y1="138" x2="298" y2="141"/>
<line class="b" stroke-width="24" x1="62" y1="136" x2="160" y2="137"/>
<circle class="hd" cx="42" cy="128" r="15"/>
<g class="lg a"><polyline class="r" stroke-width="14" points="160,136 148,83.5 207.7,88.8"/><line class="b" stroke-width="9" x1="148" y1="86" x2="128" y2="127.7"/></g>
<g class="ua a"><line class="b" stroke-width="9" x1="80" y1="128" x2="128" y2="127.7"/></g></svg>